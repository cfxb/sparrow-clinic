title: Sparrow Neuropsychology
description: >-
  Adult neuropsychological assessment in Vancouver, BC — memory, attention,
  and thinking — by Dr. Christopher Benjamin, clinical neuropsychologist.
url: "https://www.sparrow.clinic"
baseurl: ""

markdown: kramdown
permalink: /:title/

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Jekyll ignores dotfiles and leading-underscore files by default, but
# Cloudflare Pages reads _headers from the build output to set response
# headers -- it has to be explicitly included or it's silently dropped.
include:
  - _headers

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - audit
  - CLAUDE.md

defaults:
  - scope:
      path: ""
    values:
      layout: page
      image: /assets/images/og-default.jpg
  - scope:
      path: "assets/files"
    values:
      sitemap: false

sass:
  sass_dir: _sass
  style: compressed
